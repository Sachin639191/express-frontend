<!DOCTYPE html>
<html>
<head>
  <title>Express Frontend</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Express Frontend (Port 3000)</h1>
  <p>This page is served by Express.</p>
  <button onclick="callFlask()">Call Flask Backend API</button>
  <div id="result">Click the button to fetch data from Flask...</div>

  <script>
    async function callFlask() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Loading...';
      try {
        // Call Flask directly (CORS is enabled)
        const res = await fetch('http://' + window.location.hostname + ':5000/api/hello');
        const data = await res.json();
        resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (err) {
        resultDiv.innerHTML = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
